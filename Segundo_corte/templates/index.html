<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!--  <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>◇Subir Lista de Asistencia◇</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #000080;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contenedor {
            background-color: white;
            padding: 100px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        input[type="file"] {
            margin: 20px 0;
            display: block;
            width: 100%;
        }
        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #000090;
        }
     
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="LogoU.png" alt="templates">
        <h2>Control de Asistencia</h2>
        <p>Por favor, sube un archivo .txt con la lista de estudiantes.</p>
        
        <form action="/subir" method="POST" enctype="multipart/form-data">
            <input type="file" name="archivo" accept=".txt" required>
            <button type="submit"> ◇Cargar Lista</button>
        </form>
    </div>

</body>
</html>
