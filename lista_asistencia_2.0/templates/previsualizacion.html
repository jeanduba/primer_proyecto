<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Previsualización de Reporte - UNEFA</title>
    <style>
        body { 
            font-family: 'Helvetica', Arial, sans-serif; 
            margin: 40px auto; 
            max-width: 800px;
            background-color: #f5f5f5; 
            color: #000; 
        }
        
        /* Contenedor que imita una hoja física */
        .hoja-pdf {
            background-color: #fff;
            padding: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            min-height: 297mm; /* Proporción A4 aproximada */
            box-sizing: border-box;
        }

        /* Encabezado idéntico al PDF */
        .contenedor-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-pdf {
            width: 115px; /* Equivalente aproximado a los 30mm del PDF */
            height: auto;
        }
        .texto-institucional {
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .texto-institucional h1 {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .texto-institucional h2 {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        /* Tabla estilizada como el FPDF */
        .tabla-pdf { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            font-size: 15px;
        }
        .tabla-pdf th, .tabla-pdf td { 
            border: 1px solid #000; 
            padding: 10px; 
            text-align: left; 
        }
        .tabla-pdf th { 
            background-color: #c8dcff; /* Celeste institucional (RGB: 200, 220, 255) */
            color: #000;
            font-weight: bold;
        }
        
        /* Alerta roja para más de 3 faltas */
        .alerta-faltas { 
            color: red !important; 
            font-weight: bold; 
        }

        /* Panel superior de controles (No se imprime) */
        .barra-controles { 
            margin-bottom: 20px; 
            text-align: space-between;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #00417A;
            padding: 15px;
            border-radius: 5px;
        }
        .texto-barra {
            color: white;
            margin: 0;
            font-weight: bold;
        }
        .btn { 
            padding: 10px 20px; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 5px; 
            display: inline-block; 
        }
        .btn-descargar { background-color: #198754; color: white; }
        .btn-descargar:hover { background-color: #157347; }
        .btn-regresar { background-color: #ffffff; color: #00417A; border: 1px solid #fff; }
        .btn-regresar:hover { background-color: #eee; }

        /* Ocultar herramientas cuando se mande a imprimir físicamente con Ctrl+P */
        @media print { 
            .barra-controles { display: none; } 
            body { margin: 0; background-color: #fff; }
            .hoja-pdf { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="barra-controles">
        <p class="texto-barra">Vista Previa del Reporte Oficial</p>
        <div>
            <a href="{{ url_for('seleccionar') }}" class="btn btn-regresar">← Volver a la Lista</a>
            <a href="{{ url_for('descargar_pdf') }}" class="btn btn-descargar">Descargar PDF Oficial</a>
        </div>
    </div>

    <div class="hoja-pdf">
        
        <div class="contenedor-logo">
            <img src="{{ url_for('static', filename='LogoU.png') }}" alt="Escudo UNEFA" class="logo-pdf">
        </div>

        <div class="texto-institucional">
            <h1>REPUBLICA BOLIVARIANA DE VENEZUELA</h1>
            <h2>UNEFA - REPORTE DE ASISTENCIA</h2>
        </div>

        <table class="tabla-pdf">
            <thead>
                <tr>
                    <th style="width: 25%;">Cedula</th>
                    <th style="width: 55%;">Nombre y Apellido</th>
                    <th style="width: 20%;">Faltas</th>
                </tr>
            </thead>
            <tbody>
                {% for cedula, datos in lista.items() %}
                <tr>
                    <td>{{ cedula }}</td>
                    <td class="{% if datos[1] > 3 %}alerta-faltas{% endif %}">
                        {{ datos[0] }}
                    </td>
                    <td class="{% if datos[1] > 3 %}alerta-faltas{% endif %}">
                        {{ datos[1] }}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
    </div>

</body>
</html>
