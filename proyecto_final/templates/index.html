<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login SICEU</title>
  <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #002244;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contenedor {
            background-color: white;
            padding: 40px; 
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo-login {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        /* Estilo para los inputs */
        input {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px; /* Espacio real entre campos */
            border: 1px solid #ddd;
            border-radius: 8px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button {
            background-color: #0000cd;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #000000;
            transform: scale(1.05);
        }
  </style>
</head>
<body>

<div class="contenedor">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo-login">
    <h1>BIENVENIDO</h1>
    <h2>Ingresar su usuario y contraseña</h2>
    
    <form action="/login" method="POST">
        <input type="text" name="usuario" placeholder="Usuario" required>
        <input type="password" name="contraseña" minlength="8" placeholder="********" required>
        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
